[project]
name = "pdfnova-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "alembic>=1.14",
  "aiosqlite>=0.20",
  "asyncpg>=0.30",
  "arq>=0.26",
  "redis>=5.2",
  "argon2-cffi>=23.1",
  "pyjwt>=2.10",
  "pyotp>=2.9",
  "structlog>=24.4",
  "httpx>=0.28",
  "boto3>=1.35",
  "cryptography>=43",
  "prometheus-client>=0.21",
  "sentry-sdk>=2.19",
  "python-multipart>=0.0.17",
  "filetype>=1.2",
  "pikepdf>=9.4.2,<11",
  "pypdf>=5.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "moto[s3]>=5.0",
  "respx>=0.21",
  "reportlab>=4.2",
  "ruff>=0.8",
  "mypy>=1.13",
  "boto3-stubs[s3]",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PL", "N"]
ignore = ["PLR0913", "PLR0917", "PLR0915", "PLR2004", "S101", "PLR0911", "PLR0912", "RUF012", "PLC0415"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "ASYNC", "RUF001"]
"alembic/env.py" = ["F401"]
"app/services/auth.py" = ["S105"]
"app/services/oauth.py" = ["S106"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["arq.*", "filetype.*", "pikepdf.*", "pyotp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/jobs/worker.py"]
concurrency = ["greenlet", "thread", "multiprocessing"]
parallel = true
sigterm = true

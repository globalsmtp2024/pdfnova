worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    log_format main '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent '
                    '$request_time rid=$request_id';
    access_log /var/log/nginx/access.log main;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    map $http_x_forwarded_proto $forwarded_scheme {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    limit_req_zone $binary_remote_addr zone=api_per_ip:20m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=5r/s;

    upstream api_upstream {
        server api:8000;
        keepalive 32;
    }

    upstream web_upstream {
        server web:3000;
        keepalive 32;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 110m;
        client_body_buffer_size 1m;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";

        location = /metrics {
            return 404;
        }

        location ~ ^/api/v1/tasks/[^/]+/events$ {
            proxy_pass http://api_upstream;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            gzip off;
        }

        location ~ ^/api/v1/(auth|me/delete) {
            limit_req zone=auth_per_ip burst=10 nodelay;
            proxy_pass http://api_upstream;
        }

        location ~ ^/api/v1/(uploads/|tasks/[^/]+/files|library/files|esign/requests$) {
            limit_req zone=api_per_ip burst=60 nodelay;
            proxy_pass http://api_upstream;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /api/ {
            limit_req zone=api_per_ip burst=60 nodelay;
            proxy_pass http://api_upstream;
            proxy_read_timeout 120s;
        }

        location /health/ {
            proxy_pass http://api_upstream;
        }

        location ~ ^/(docs|redoc|openapi\.json)$ {
            proxy_pass http://api_upstream;
        }

        location /_next/static/ {
            proxy_pass http://web_upstream;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location = /sw.js {
            proxy_pass http://web_upstream;
            add_header Cache-Control "no-cache";
        }

        location / {
            proxy_pass http://web_upstream;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
